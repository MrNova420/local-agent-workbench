name: Windows source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read paired engine revision
        id: engine-pin
        shell: pwsh
        run: |
          $revision = (Get-Content core-revision.txt -Raw).Trim()
          if ($revision -notmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') { throw 'core-revision.txt must contain a full Git object ID.' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: MrNova420/local-agent-workbench-core
          ref: ${{ steps.engine-pin.outputs.revision }}
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r engine/requirements.txt -r sidecar/requirements.txt pytest
      - name: Install Node dependencies
        run: npm ci
      - name: Typecheck desktop app
        run: npm run typecheck
      - name: Test desktop and sidecar
        run: npm test
        env:
          LOCAL_AGENT_CORE_PATH: ${{ github.workspace }}/engine
      - name: Test shared agent engine
        run: python -m pytest -q
        working-directory: engine
